openapi: 3.0.0
info:
  title: Todo List Service API
  description: API for managing todo lists and tasks.
  version: 1.0.0
servers:
  - url: http://localhost:3002
    description: Local server
paths:
  /:
    get:
      summary: Health check
      description: Returns a welcome message to confirm the service is running.
      responses:
        '200':
          description: Service is running
          content:
            text/plain:
              schema:
                type: string
                example: Todo List Service is running
  /api/v1/user/add-list:
    post:
      summary: Create a new task
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskInput'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/user/list-all:
    get:
      summary: Get all tasks
      tags:
        - Tasks
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of items per page
        - in: query
          name: sortOrder
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort order
        - in: query
          name: sortBy
          schema:
            type: string
            default: totalEffortHours
          description: Field to sort by
        - in: query
          name: taskStatus
          schema:
            type: string
            enum: [Pending, In-Progress, Completed]
          description: Filter by task status
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/user/list/{id}:
    get:
      summary: Get task by ID
      tags:
        - Tasks
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: Task ID
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/user/list/{id}/status:
    patch:
      summary: Update task status by ID
      tags:
        - Tasks
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: Task ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskInput'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Task:
      type: object
      properties:
        _id:
          type: string
          example: 60d5ecb8b392d7001f8e8e8e
        taskName:
          type: string
          example: Complete Project Documentation
        description:
          type: string
          example: Write comprehensive documentation for the API.
        taskStartDate:
          type: string
          format: date-time
        taskEndDate:
          type: string
          format: date-time
        taskStatus:
          type: string
          enum: [Pending, In-Progress, Completed]
          example: Pending
        totalEffortHours:
          type: number
          example: 5
        userId:
          type: string
          example: user123
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateTaskInput:
      type: object
      required:
        - taskName
        - description
        - taskStartDate
        - taskEndDate
        - totalEffortHours
      properties:
        taskName:
          type: string
        description:
          type: string
        taskStartDate:
          type: string
          format: date-time
        taskEndDate:
          type: string
          format: date-time
        totalEffortHours:
          type: number
        userId:
          type: string
    UpdateTaskInput:
      type: object
      required:
        - taskStatus
      properties:
        taskStatus:
          type: string
          enum: [Pending, In-Progress, Completed]
        taskName:
          type: string
        description:
          type: string
        totalEffortHours:
          type: number
    TaskListResponse:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        totalTasks:
          type: integer
        currentPage:
          type: integer
        pageSize:
          type: integer
    Error:
      type: object
      properties:
        message:
          type: string
        error:
          type: string
